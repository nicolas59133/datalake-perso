[project]
name = "data-platform"
version = "0.1.0"
description = "Datalake perso — Dagster + dlt + DuckDB (démarrage local)"
requires-python = ">=3.10"

[tool.dagster]
module_name = "data_platform.definitions"
code_location_name = "data_platform"

[tool.pytest.ini_options]
pythonpath = ["."]

[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"
